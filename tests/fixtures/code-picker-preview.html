<!doctype html><meta charset="utf-8"><title>Mail Verify preview</title>
<style>body{font:18px system-ui;margin:70px;background:#fff;color:#222}main{max-width:640px;margin:auto}h1{color:#4ca4c5;font:42px Georgia}input{display:block;box-sizing:border-box;width:100%;height:48px;padding:10px;font:18px system-ui;margin-top:12px}label{font-size:16px}p{line-height:1.5}</style>
<main><h1>Email verification</h1><p>We sent a security code to your email.<br>Choose the suggestion below to fill it.</p><label for="verification-code">Enter code</label><input id="verification-code" autocomplete="one-time-code"></main>
<button id="resendEmail">Resend email</button>
<button id="sendAgain">Send again</button>
<button id="deliverCode">Deliver replacement code</button>
<p id="feedback" aria-live="polite"></p>
<script type="module">
import { startCodePicker } from '/extension/inline/code-picker-controller.js';
import { inlineRuntime } from '/tests/mock_inline_port.js';
// Synthetic mail response; no native bridge or real inbox access in this fixture.
let item = {uid:1,accountEmail:'preview@yahoo.com',code:'331519',sender:'auth@example.test',subject:'Your security code',receivedAt:Date.now()};
window.chrome = {runtime:inlineRuntime(()=>({ok:true,codes:[item]}))};
for (const id of ['resendEmail', 'sendAgain']) document.getElementById(id).onclick = () => {
  document.getElementById('feedback').textContent = 'New email requested. The previous code must disappear.';
};
document.getElementById('deliverCode').onclick = () => {
  item = {...item, uid:item.uid + 1, code:'654321', receivedAt:Date.now()};
  document.getElementById('feedback').textContent = 'Replacement email delivered. Wait for its suggestion.';
};
document.querySelector('input').focus();
document.querySelector('input').addEventListener('input',e=>document.querySelector('#feedback').textContent=e.target.value===item.code?'Code filled successfully.':'');
startCodePicker();
</script>
