<!doctype html><meta charset="utf-8"><title>Yahoo Code Fill preview</title>
<style>body{font:18px system-ui;margin:70px;background:#fff;color:#222}main{max-width:640px;margin:auto}h1{color:#4ca4c5;font:42px Georgia}input{display:block;box-sizing:border-box;width:100%;height:48px;padding:10px;font:18px system-ui;margin-top:12px}label{font-size:16px}p{line-height:1.5}</style>
<main><h1>Email verification</h1><p>We sent a security code to your email.<br>Choose the suggestion below to fill it.</p><label for="verification-code">Enter code</label><input id="verification-code" autocomplete="one-time-code"><p id="feedback" aria-live="polite"></p></main>
<script type="module">
import { startInlinePicker } from '/extension/inline.js';
// Synthetic mail response; no native bridge or real inbox access in this fixture.
window.chrome = {runtime:{sendMessage:async()=>({ok:true,codes:[{uid:1,accountEmail:'preview@yahoo.com',code:'331519',sender:'auth@example.test',subject:'Your security code',receivedAt:Date.now()}]})}};
document.querySelector('input').focus();
document.querySelector('input').addEventListener('input',e=>document.querySelector('#feedback').textContent=e.target.value==='331519'?'Code filled successfully.':'');
startInlinePicker();
</script>
