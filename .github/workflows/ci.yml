name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Python and JavaScript tests
        run: npm test
      - name: Validate extension and JavaScript syntax
        run: |
          python3 -m json.tool extension/manifest.json >/dev/null
          find extension -name '*.js' -exec node --check {} \;
